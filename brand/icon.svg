<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- ==================================================================
       RewireMind — the app icon, as one file

       The adaptive layers (icon_bg.svg + icon_fg.svg) composited onto the
       squircle a launcher would otherwise mask for us. This is the version
       for everywhere that wants a finished icon: the web app, the favicon,
       the site, a store listing.
       ================================================================== -->
  <defs>
    <linearGradient id="ground" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="108" y2="108">
      <stop offset="0" stop-color="#22A660"/>
      <stop offset="1" stop-color="#0E6338"/>
    </linearGradient>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse"
                    x1="54" y1="26" x2="54" y2="82">
      <stop offset="0" stop-color="#FFC0BA"/>
      <stop offset="1" stop-color="#F6968F"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="108" height="108" rx="25" ry="25"/>
    </clipPath>
    <radialGradient id="bloom" gradientUnits="userSpaceOnUse"
                    cx="88" cy="14" r="76">
      <stop offset="0" stop-color="#FFF3B0" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFF3B0" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="108" height="108" fill="url(#ground)"/>
    <rect width="108" height="108" fill="url(#bloom)"/>

    <!-- A shade larger than the adaptive foreground. Nothing masks this
         version, so it does not have to respect the 66dp safe circle. -->
    <g transform="translate(54 54) scale(1.13) translate(-54 -54)">
    <g fill="url(#skin)">
      <ellipse cx="54" cy="58" rx="28" ry="21"/>
      <ellipse cx="54" cy="65" rx="25" ry="14"/>
      <circle cx="34" cy="46" r="11"/>
      <circle cx="44" cy="41" r="11"/>
      <circle cx="54" cy="39" r="11"/>
      <circle cx="64" cy="41" r="11"/>
      <circle cx="74" cy="46" r="11"/>
      <circle cx="30" cy="57" r="7"/>
      <circle cx="78" cy="57" r="7"/>
    </g>

    <g fill="none" stroke="#E77E77" stroke-width="2.2" stroke-linecap="round"
       opacity="0.75">
      <path d="M54 31 Q50.5 37 54 43"/>
      <path d="M36 39 Q41.5 43.5 38 49"/>
      <path d="M72 39 Q66.5 43.5 70 49"/>
    </g>

    <g fill="#F5837C" opacity="0.5">
      <ellipse cx="33" cy="62" rx="5.4" ry="4.2"/>
      <ellipse cx="75" cy="62" rx="5.4" ry="4.2"/>
    </g>

    <g fill="none" stroke="#3A2422" stroke-width="3.6" stroke-linecap="round">
      <path d="M39 56 Q44.5 49.5 50 56"/>
      <path d="M58 56 Q63.5 49.5 69 56"/>
      <path d="M48.5 64.5 Q54 71 59.5 64.5"/>
    </g>
    </g>
  </g>
</svg>
